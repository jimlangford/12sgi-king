<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="game-auth-url" content="https://auth.12sgi.com/api/v2/auth/magic-link">
  <title>Sign in · TribeGameStudios</title>
  <style>
    :root{color-scheme:dark;--bg:#161209;--panel:#231d10;--line:#5a4f33;--gold:#e3ad33;--ink:#f7f1e3;--muted:#d8cdb0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,440px);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
    h1{margin:0 0 8px;color:var(--gold);font-size:24px}
    p{color:var(--muted);line-height:1.55}
    label{display:block;margin:20px 0 6px;font-weight:600}
    input,button{width:100%;padding:12px;border-radius:8px;font:inherit}
    input{border:1px solid var(--line);background:var(--bg);color:var(--ink)}
    #submit{color:#161209}
    button{margin-top:12px;border:0;background:var(--gold);color:#161209;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #message{min-height:1.5em;margin-top:12px;color:var(--gold);font-size:13px}
    a{color:var(--gold)}
  </style>
</head>
<body>
  <main>
    <h1>Join a game circle</h1>
    <p>Enter your email and we’ll send a one-time sign-in link. Accounts are free and limited to multiplayer games.</p>
    <form id="signin">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      <button id="submit" type="submit">Email me a sign-in link</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <p><a href="/games/">Back to games</a></p>
  </main>
  <script>
    (function () {
      'use strict';
      var message = document.getElementById('message');
      function safeGamePath(value) {
        if (!value || value.length > 2048 || value.indexOf('/games/') !== 0 ||
            value.indexOf('//') === 0 || value.indexOf('\\') !== -1) return '/games/';
        try {
          var target = new URL(value, location.origin);
          return target.origin === location.origin ? target.pathname + target.search : '/games/';
        } catch (e) { return '/games/'; }
      }

      var fragment = new URLSearchParams(location.hash.slice(1));
      var token = fragment.get('token');
      if (token) {
        try { sessionStorage.setItem('tribegame.session', token); } catch (e) {}
        var destination = safeGamePath(fragment.get('rt'));
        history.replaceState(null, '', location.pathname + location.search);
        location.replace(destination);
        return;
      }

      document.getElementById('signin').addEventListener('submit', function (event) {
        event.preventDefault();
        var button = document.getElementById('submit');
        button.disabled = true;
        message.textContent = 'Sending…';
        var returnTo = safeGamePath(new URLSearchParams(location.search).get('rt'));
        fetch(document.querySelector('meta[name="game-auth-url"]').content, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            return_to: returnTo
          })
        }).then(function (response) {
          if (!response.ok) throw new Error('unavailable');
          return response.json();
        }).then(function () {
          message.textContent = 'If this address can sign in, a one-time link will arrive shortly.';
          document.getElementById('email').value = '';
        }).catch(function () {
          message.textContent = 'Sign-in email is temporarily unavailable. Please try again later.';
        }).finally(function () { button.disabled = false; });
      });
    })();
  </script>
</body>
</html>
