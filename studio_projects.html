:root{--bg:#081420;--panel:#0f2540;--panel2:#12294a;--line:#26456a;--line2:#1b3357;--ink:#eef4fc;--dim:#c6d6ee;

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{position:sticky;top:0;z-index:20;background:#0b1c30;border-bottom:1px solid var(--line);display:flex;

.mini{font:600 11px var(--sans);border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:6px;padding:3px 8px;cursor:pointer}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b1c30;border:1px solid var(--line);padding:9px 15px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}

e": "EXT. KANAHA BEACH \u2013 DUSK", "detail": "A line of community members face the ocean. Some carry torches. Others, saplings. Langford stands at the front, stone in hand.\n\nHe kneels. Plants the stone in wet sand. A rhythmic "}, {"id": "sc07", "title": "INT. TEMPORARY COUNTY OFFICE \u2013 NEXT MORNING", "detail": "Dr. Josh, Wilmont, and Langford sit before a map of Maui. It\u2019s been marked with 54 nodes.\n\n(food-sovereign pause)\n\nWe\u2019re not a smart city. We\u2019re a wise island.\n\nWilmont chuckles. D"}, {"id": "sc08", "title": "INT. OLD SCHOOL GYM \u2013 DAY", "detail": "A mix of high schoolers and k\u016bpuna gather around iPads and seed trays. On-screen, a SAGE GAME avatar tends a digital lo\u02bbi patch.\n\nA boy raises his hand.\n\nThe class erupts in excite"}, {"id": "sc09", "title": "INT. COUNTY CORPORATION COUNSEL OFFICE \u2013 NIGHT", "detail": "Fluorescent lights buzz. Langford sits across from a skeptical government attorney."}, {"id": "sc10", "title": "EXT. TOP OF HALEAKAL\u0100 \u2013 NIGHT", "detail": "Langford alone. Stars blaze above. He places his hand on the final stone in his pack. It glows faintly.\n\n(beat)\n\nAnd one more for those who tried to stop it\u2026\n\nBut couldn\u2019t stop the"}, {"id": "sc11", "title": "INT. WAILUKU RECORDS OFFICE \u2013 DAY", "detail": "A dusty archive. Langford and LEHUA dig through files. Old land titles, maps, microfilm reels.\n\nPAGE 7"}, {"id": "sc12", "title": "INT. MAKENA HOUSE CHURCH \u2013 EVENING", "detail": "A small group sits barefoot in a circle. Psalms and \u02bb\u014dlelo mix softly in the background.\n\n(pause)\n\nBut land with prayer\u2026 becomes sacred again.\n\nShe blesses the seventh stone with o"}, {"id": "sc13", "title": "EXT. LAHAINA BURN ZONE \u2013 DAY", "detail": "Charred earth. Langford walks slowly, documenting with a drone. Children trail behind him, planting seeds.\n\n(beat)\n\nAnd the seeds\u2026 they forgive.\n\nA small green sprout pokes through"}, {"id": "sc14", "title": "INT. MAUI COUNTY MEETING ROOM \u2013 DAY", "detail": "Langford presents to a room of county planners and federal observers. A giant screen behind him shows a rotating model: the 12 STONES Digital Twin.\n\n(he holds up a taro root)\n\nYou "}, {"id": "sc15", "title": "EXT. MAKAWAO FARMBOX HUB \u2013 MORNING", "detail": "A sleek but earthy hydroponic structure built from repurposed materials. Inside, rows of lettuce glow under LED. IoT sensors blink green.\n\nA keiki scans a QR code. Data loads showi"}, {"id": "sc16", "title": "INT. O\u02bbAHU \u2013 OFFICE OF INNOVATION AND SUSTAINABILITY \u2013 DAY", "detail": "A Zoom call with DR. JOSH, WILMONT, and two federal liaisons. Charts on screen: \u201cGenerational Wealth Fund \u2013 12.5% Model.\u201d\n\n(beat)\n\nWhere Food Comes From signs off on every transact"}, {"id": "sc17", "title": "INT. MOLOKA\u02bbI SCHOOLHOUSE \u2013 DAY", "detail": "A single-room classroom. Kids huddle around an iPad running Sage Game. They cheer as they restore a digital lo\u02bbi. One boy wears a \u201cBig Jim Algorithm\u201d hoodie.\n\nIt was forgiveness\u2026 g"}, {"id": "sc18", "title": "INT. ANIMATION STUDIO \u2013 NIGHT", "detail": "Lehua works on Cartoon Animator 5. A 2.5D animated kupuna speaks softly.\n\nLehua runs lip sync, matches audio to the glyphs on screen.\n\nPAGE 15"}, {"id": "sc19", "title": "EXT. HANA MOUNTAINSIDE \u2013 DUSK", "detail": "Langford stands alone. He places the eleventh stone beneath a twisted koa tree.\n\nOne for the mothers\u2026\n\nAnd this one\u2014for the ones who hid us in plain sight.\n\nHe looks down the mount"}, {"id": "sc20", "title": "INT. SMALL RADIO STUDIO \u2013 LAHAINA \u2013 NIGHT", "detail": "A glowing ON AIR sign. Langford sits across from a local host. The show is called \u201cEchoes in Courage.\u201d Old vinyls line the wall.\n\n(beat)\n\nBut I\u2019m still breathing. And I\u2019m still pla"}, {"id": "sc21", "title": "EXT. SACRED BURIAL GROUND \u2013 MOLOKA\u02bbI \u2013 SUNSET", "de ls, Indigenous protocols mapped to HUD zoning.\n\nThe crowd listens, captivated.\n\nThis isn\u2019t tech. It\u2019s testimony.\n\nHe places a scroll"}, {"id": "sc29", "title": "EXT. MAKENA BEACH \u2013 SUNSET", "detail": "A bonfire crackles. The team, at rest. Lehua strums a \u02bbukulele. Kahu lights a kukui lamp. Children run between the waves.\n\nThey drink. Quiet. Alive. The stars emerge, one by one.\n\n"}, {"id": "sc30", "title": "INT. LANGFORD\u2019S CABIN \u2013 NIGHT", "detail": "Rain pours outside. Wilmont slams a map down.\n\nWe show the receipts\u2014and let the land speak.\n\nPAGE 29"}, {"id": "sc31", "title": "EXT. BATTLE MAP SEQUENCE \u2013 TARANTINO STYLE MONTAGE", "detail": "A pulsing track kicks in\u2014tribal drums mixed with analog synth. Each shot hits like a strike:\n\n\u2013 A blockchain contract burned into parchment\n\n\u2013 A family in H\u0101na rejecting a federal "}, {"id": "sc32", "title": "INT. FINAL NODE ACTIVATION \u2013 MOKU\u02bbULA SHRINE \u2013 NIGHT", "detail": "A coded ritual begins. Twelve stones are placed around a sacred spring. Lehua enters the last sequence. The system glows\u2014a heartbeat made visible.\n\nAll ancestors honored.\n\nFinal au"}, {"id": "sc33", "title": "EXT. WASHINGTON D.C. \u2013 PRIVATE GALA \u2013 NIGHT", "detail": "A gold-lit ballroom. Men in tailored suits toast with aged scotch. A Hawaiian print shirt among them draws murmurs\u2014John SAUNDERS, CEO of \u201cWhere Food Comes From,\u201d smiles like a man "}, {"id": "sc34", "title": "INT. MAUI COUNTY \u2013 DARK OFFICE \u2013 LATE NIGHT", "detail": "*A man in a windbreaker pulls papers from a locked drawer. Land deeds. USDA grants. All stamped over with: \u201cREDIRECTED.\u201d\n\nThe door opens. Wilmont steps in. Cocks a flashlight like "}, {"id": "sc35", "title": "INT. SAGE GAME LAUNCH \u2013 NIGHT", "detail": "A crowd gathers at a pop-up cinema in Lahaina. Projectors show the game opening: animated glyphs become living systems. Avatar kupuna guide players through rebuilding a burned ahup"}, {"id": "sc36", "title": "EXT. HIDDEN MEADOW \u2013 NIGHT", "detail": "Langford meets with a quiet elder\u2014KANAKA\u02bbOLE\u2014a living guardian of chants. The man places a stone seal into Langford\u2019s hand.\n\nKANAKA\u02bbOLE\n\nThis is the one you don\u2019t touch with ambiti"}, {"id": "sc37", "title": "INT. DIGITAL WAR ROOM \u2013 NIGHT", "detail": "Lehua overlays every data set. HUD. FEMA. Title chains. Indigenous testimonies. The system pulses red. Someone is forging new claims\u2014at speed.\n\nHe opens the Big Jim Algorithm\u2014overl"}, {"id": "sc38", "title": "EXT. MAUI \u2013 SCATTERED MONTAGE \u2013 NIGHT TO DAWN", "detail": "A pounding montage unfolds:\n\n\u2013 A child sleeps next to a seedling and a stone pendant\n\n\u2013 Wilmont leads a march through county offices, returning false deeds\n\n\u2013 Lehua sings over a ci"}, {"id": "sc39", "title": "INT. NATIONAL PRESS ROOM \u2013 DAY", "detail": "A major network breaks the story: \u201c12 Stones: How One Island Flipped the Script on Federal Development.\u201d The world reacts. Hashtags explode. A cultural reckoning erupts.\n\nPAGE 39"}, {"id": "sc40", "title": "INT. MAUI COUNTY \u2013 CEREMONIAL CHAMBER \u2013 NIGHT", "detail": "The original twelve stones are now arranged in a sacred grid. Langford kneels before them. Children circle the stones. Dr. Josh brings out the final glyph.\n\nHe places the glyph ont"}, {"id": "sc41", "title": "INT. GLOBAL FORUM \u2013 GENEVA \u2013 NIGHT", "detail": "A UN-style gathering. LANGFORD speaks before world leaders, climate scientists, and tribal representatives.\n\nWe came to return a pattern.\n\n(holds up a scroll)\n\nTwelve stones. Twelv"}, {"id": "sc42", "title": "INT. UNDERGROUND SERVER FARM \u2013 NIGHT", "detail": "A sleek, digital vault in Texas. STONEWELL and his team panic as the 12 Stones system locks them out. One screen flashes:*\n\nIt doesn\u2019t recognize us.\n\nStonewell throws a chair. Spar"}, {"id":  // group by owner -> quadrant
 var byOwner={};DATA.projects.forEach(function(p){(byOwner[p.owner]=byOwner[p.owner]||[]).push(p);});
 Object.keys(byOwner).forEach(function(own){

 });

}
function open(p){
 var lanes=charLane(p);
 lanes+=lane("Storyboard / Scenes",p.scenes,p.id,function(a){return assetCard(p.id,a,a.detail,"");});
