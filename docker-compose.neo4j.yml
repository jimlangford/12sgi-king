# STANDALONE neo4j -- the QUAD OS shared graph, on its own lifecycle, isolated from the v2 app stack.
# (Jimmy 2026-07-15: "isolate neo4j so a v2 deploy can never wipe the brain again.")
#
# 2026-11-16 (audit-quad-os): rewritten to describe the container that actually holds the graph.
# The 2026-07-15 version of this file described `quados-neo4j` on volume `12sgi-king_v2-neo4j-data`.
# The graph has lived in `lotus-neo4j` on volume `lotus-neo4j-data` since 2026-07-28. Image, auth and
# memory settings below match that container.
#
# THREE RULES THIS FILE ENFORCES
#   1. PORTS ARE LOOPBACK-ONLY (127.0.0.1). The graph runs with NEO4J_AUTH=none because every consumer
#      is on this machine, so the bind address IS the access control. Never publish 7474 or 7687
#      without the 127.0.0.1 prefix.
#   2. ITS OWN COMPOSE PROJECT (`name:` below). Without it Compose names the project after the folder
#      (`12sgi-king`), which is the same project as docker-compose.v2.yml, and the two stacks then see
#      each other's containers. A separate project keeps any v2 up/down away from the graph.
#   3. THE IMAGE IS NEVER PULLED. `pull_policy: never` uses the image already on this machine, so
#      starting the graph cannot trigger a surprise upgrade or a large download.
#
# WHO CONNECTS, AND HOW (checked 2026-11-16)
#   - native tools (tools/ops/lane_task_graph.py and the rest): http://127.0.0.1:7474, no auth
#   - `docker exec <container> cypher-shell` tools: the name is resolved by tools/ops/neo4j_container.py,
#     default `lotus-neo4j` -- so container_name below must not change
#   - containers (studio-assets, king-bridge, auth): http://host.docker.internal:7474. Docker Desktop
#     forwards that to the host's loopback, so a 127.0.0.1 publish still reaches them (tested)
#   - v2 services configured with http://neo4j:7474 do NOT resolve that name; see the optional block
#     at the bottom of this file
#
# DATA SAFETY: both volumes are `external`. Compose never creates or deletes them; `down`, and even
# `down -v`, leave them in place.
#
# Ops:  docker compose -f docker-compose.neo4j.yml up -d     # start / keep alive
#       docker compose -f docker-compose.neo4j.yml ps        # status and health
#       docker compose -f docker-compose.neo4j.yml down      # stop and remove the container; data stays
# If a container named lotus-neo4j already exists that this file did not create, `up` stops with a
# name conflict. Rename or remove that one first; the cutover runbook is in the private system docs.
name: lotus-neo4j

services:
  neo4j:
    image: neo4j:5-community          # the local image is 5.26.28
    pull_policy: never
    container_name: lotus-neo4j
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - graph-data:/data
      - graph-logs:/logs
    ports:
      - "127.0.0.1:7474:7474"         # HTTP: browser and the tx/commit API
      - "127.0.0.1:7687:7687"         # Bolt
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  # EXTERNAL = reuse the volumes that already hold the graph. Never created or removed by this file.
  graph-data:
    external: true
    name: lotus-neo4j-data
  graph-logs:
    external: true
    name: 12sgi-king_v2-neo4j-logs

# OPTIONAL -- let the v2 services that are configured with http://neo4j:7474 find the graph by name.
#
# Trade-off: the network `12sgi-king_default` is created by docker-compose.v2.yml. If it does not
# exist, this file refuses to start, which ties the graph's startup to the v2 stack again -- the
# coupling the 2026-07-15 isolation removed. The alternative needs no coupling: set NEO4J_HTTP for
# those services to http://host.docker.internal:7474/db/neo4j/tx/commit in the v2 env, the way
# king-bridge and auth already do.
#
# To enable the network route instead, add under services.neo4j:
#     networks:
#       default: {}
#       v2:
#         aliases: [neo4j]
# and at the top level:
# networks:
#   v2:
#     external: true
#     name: 12sgi-king_default
