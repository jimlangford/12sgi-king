# PRIVATE host proxy, not the Docker nginx configuration.
# Run from repo root: nginx -p <absolute-repo-path>/ -c nginx-tailscale.conf
# Create logs/ first. Validate with the same arguments plus -t before reload.
worker_processes 1;
error_log stderr;
pid logs/nginx-private.pid;
events { worker_connections 128; }
http {
    access_log off;
    map $uri $v2_upstream {
        default "";
        ~^/api/v2/auth(?:/|$) 127.0.0.1:8101;
        ~^/api/v2/cases(?:/|$) 127.0.0.1:8102;
        ~^/api/v2/documents(?:/|$) 127.0.0.1:8103;
        ~^/api/v2/storage(?:/|$) 127.0.0.1:8104;
        ~^/api/v2/ai(?:/|$) 127.0.0.1:8105;
        ~^/api/v2/gpu(?:/|$) 127.0.0.1:8107;
        ~^/api/v2/(?:assets|stats|crosswalk|tenants|characters|styles|clips|reindex|projects|media)(?:/|$) 127.0.0.1:8108;
        ~^/api/v2/(?:bridge|board|owner)(?:/|$) 127.0.0.1:8109;
    }
    server {
        listen 127.0.0.1:8081;
        server_name _;
        include nginx-board-config.conf;
        # Owner pages belong to the existing native private server, NEVER the public build.
        location = /go.html {
            proxy_pass http://127.0.0.1:8799;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /go/ {
            proxy_pass http://127.0.0.1:8799;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /king { return 308 /king/; }
        location /king/ {
            proxy_pass http://127.0.0.1:8799;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /board { return 308 /board/; }
        location /board/ {
            proxy_pass http://127.0.0.1:8799;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/v2/ {
            if ($v2_upstream = "") { return 404; }
            proxy_pass http://$v2_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 180s;
        }
        location /api/v1/ {
            proxy_pass http://127.0.0.1:8106;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
