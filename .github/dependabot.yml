version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /services/ai
      - /services/ai_gateway
      - /services/auth
      - /services/board_api
      - /services/documents
      - /services/gpu_router
      - /services/health
      - /services/king_bridge
      - /services/storage
      - /services/studio_assets
      - /services/tenant
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /services
      - /v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
