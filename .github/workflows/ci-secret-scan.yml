name: CI - Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .secret-scan-work/bin
          cd .secret-scan-work/bin
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Verify scanner enforcement
        run: |
          gitleaks version
          python3 -m unittest discover -s tests -p test_secret_scanner.py -v

      - name: Scan tracked tree and reachable history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          mkdir .secret-scan-work/tree
          git archive HEAD | tar -xf - -C .secret-scan-work/tree
          # Run both gates even when the first finds a secret. Never publish reports.
          status=0
          gitleaks dir .secret-scan-work/tree --config .gitleaks.toml \
            --ignore-gitleaks-allow --gitleaks-ignore-path .secret-scan-work/absent \
            --redact --no-banner --log-level error || status=1
          gitleaks git . --log-opts='--all --full-history' --config .gitleaks.toml \
            --ignore-gitleaks-allow --gitleaks-ignore-path .secret-scan-work/absent \
            --redact --no-banner --log-level error || status=1
          exit "$status"
