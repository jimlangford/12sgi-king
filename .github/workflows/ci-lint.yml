name: CI - Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.17.5
      - name: Ruff correctness (tracked Python with explicit legacy baseline)
        run: |
          python - <<'PY'
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          files = subprocess.check_output([
              "git", "ls-files", "-z", "--", "*.py", "*.pyi",
              ":(exclude)site/**", ":(exclude).github/agents/**",
          ]).decode().split("\0")
          result = subprocess.run([
              "ruff", "check", "--select", "E9,F63,F7,F82",
              "--output-format", "json", "--", *filter(None, files),
          ], capture_output=True, text=True)
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr or result.stdout)
          # Nine pre-existing findings, not blanket file/rule exclusions.
          # Do not expand without review; remove entries as owners repair them.
          # Any touched file ALSO gets the strict gate below, without this baseline.
          baseline = Counter({
              ("_fix_failing.py", "invalid-syntax",
               "missing closing quote in string literal"): 1,
              ("services/king_bridge/app/_tree.py", "F821",
               "Undefined name `_neo_cypher`"): 1,
              ("services/studio_assets/app/main.py", "F821",
               "Undefined name `_sys`"): 5,
              ("watchers/moon_letter.py", "F821",
               "Undefined name `sourced_count`"): 1,
              ("watchers/studio_project.py", "F821",
               "Undefined name `store_path`"): 1,
          })
          unexpected = 0
          for finding in json.loads(result.stdout):
              path = Path(finding["filename"]).relative_to(Path.cwd()).as_posix()
              code, message = finding["code"], finding["message"]
              key = (path, code, message)
              known = baseline[key] > 0
              baseline[key] -= 1
              level = "warning" if known else "error"
              row = finding["location"]["row"]
              label = "legacy baseline" if known else "new correctness error"
              print(f"::{level} file={path},line={row}::{label}: {code}: {message}")
              unexpected += not known
          raise SystemExit(bool(unexpected))
          PY
      # The tracked baseline has thousands of legacy findings. Start with the
      # policy/readiness tools and ratchet ALL changed Python files into E/W/F/I.
      # No whole-repository formatter or complexity rewrite is part of this gate.
      - name: Ruff check (correctness, style, and import sorting)
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ.get("DIFF_BASE", "")
          head = os.environ["DIFF_HEAD"]
          patterns = [
              "*.py", "*.pyi",
              ":(exclude)site/**", ":(exclude).github/agents/**",
          ]
          if base and set(base) != {"0"}:
              command = [
                  "git", "diff", "--name-only", "--diff-filter=ACMR",
                  "-z", f"{base}...{head}", "--", *patterns,
              ]
          else:
              # A new branch/initial push has no usable `before` commit.
              command = [
                  "git", "diff-tree", "--root", "--no-commit-id",
                  "--name-only", "--diff-filter=ACMR", "-r", "-z",
                  head, "--", *patterns,
              ]
          changed = subprocess.check_output(command).decode().split("\0")
          targets = {
              "tools/lint_ai_tool_registry.py",
              "tools/civic_onboarding_readiness.py",
          }
          targets.update(path for path in changed if path and Path(path).is_file())
          print("Ruff scope:\n" + "\n".join(sorted(targets)), flush=True)
          subprocess.run(["ruff", "check", "--", *sorted(targets)], check=True)
          PY

  lint-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install yamllint
        run: python -m pip install yamllint==1.38.0
      # Structural validation, not a bulk long-line cleanup. `relaxed` accepts
      # GitHub's `on` key. The sole comma-spacing exception preserves aligned
      # owner asset mounts; duplicate keys/syntax/other rules still apply there.
      - name: Lint all tracked workflow and Compose YAML
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml' \
              '*compose*.yml' '*compose*.yaml'
          )
          test "${#files[@]}" -gt 0
          config='
          extends: relaxed
          rules:
            line-length: disable
            commas:
              ignore: |
                deploy/studio-assets/docker-compose.studio-assets.yml
          '
          yamllint --strict -d "$config" "${files[@]}"

  lint-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck=0.9.0-1
      # Enforce maintained automation, not the owner's local startup.sh or
      # one-off .github/project_setup helper. Only check_surfaces.sh may source
      # optional owner .env files absent from CI (SC1091); other findings fail.
      - name: Check tracked automation shell scripts
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git ls-files -z -- '.github/deploy/*.sh' 'scripts/*.sh' \
              'tests/*.sh' 'v2/scripts/*.sh' ':(exclude)scripts/check_surfaces.sh'
          )
          test "${#files[@]}" -gt 0
          shellcheck --external-sources "${files[@]}"
          shellcheck --external-sources --exclude=SC1091 scripts/check_surfaces.sh
