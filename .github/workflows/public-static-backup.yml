name: PUBLIC static backup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-static-backup
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
      pages: read
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.PUBLIC_BACKUP_ENABLED == 'true' &&
      vars.PUBLIC_BACKUP_APPROVED_SHA == github.sha
    environment: public-static-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHROME_BIN: /usr/bin/google-chrome
      APPROVED_SHA: ${{ github.sha }}
      REVIEWED_BASE: ${{ vars.PUBLIC_BACKUP_BASE_SHA }}
      RELEASE_STATE: ${{ runner.temp }}/public-backup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Refuse primary-domain Pages hosting (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BACKUP_URL: ${{ vars.PUBLIC_BACKUP_URL }}
        run: >-
          python tools/public_release.py --check-pages
          --repository "$GITHUB_REPOSITORY" --backup-url "$EXPECTED_BACKUP_URL"
      - name: Provision existing pinned validators
        run: |
          python -m pip install -r requirements-ci.txt ruff==0.17.5 yamllint==1.38.0
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck=0.9.0-1
          npm ci --ignore-scripts --no-fund --no-audit --prefix tools/a11y
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          cd "${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Full local-first gate and PUBLIC-only export
        run: |
          test -n "$REVIEWED_BASE"
          python tools/public_release.py --package-only --state "$RELEASE_STATE" \
            --expected-sha "$APPROVED_SHA" --base "$REVIEWED_BASE"
      - name: Upload only validated PUBLIC files, never checkout or receipts
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/public-backup/releases/${{ github.sha }}/public
          retention-days: 1

  deploy:
    needs: package
    if: >-
      vars.PUBLIC_BACKUP_ENABLED == 'true' &&
      vars.PUBLIC_BACKUP_APPROVED_SHA == github.sha
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Recheck backup-only hosting before deploy (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BACKUP_URL: ${{ vars.PUBLIC_BACKUP_URL }}
        run: >-
          python3 tools/public_release.py --check-pages
          --repository "$GITHUB_REPOSITORY" --backup-url "$EXPECTED_BACKUP_URL"
      - name: Deploy separate static backup (no private runtime control)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify the served PUBLIC commit and record backup freshness
        env:
          EXPECTED_BACKUP_URL: ${{ vars.PUBLIC_BACKUP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: >-
          python3 tools/public_release.py --verify-backup
          --repository "$GITHUB_REPOSITORY" --backup-url "$EXPECTED_BACKUP_URL"
          --expected-sha "$EXPECTED_SHA"
