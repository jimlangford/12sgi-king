name: CI - Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-v2:
    name: V2 + Studio tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Run V2 suite and Studio tests
        run: python tools/local_ci.py --junitxml="${RUNNER_TEMP}/test-results.xml"
      - name: Test summary
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Python ${{ matrix.python }} tests"
            echo "Result: ${TEST_STATUS}"
            echo "Contract, loopback integration, hardening, and Studio asset validation."
            echo "No Docker, Neo4j, Ollama, or external credentials required."
          } >> "$GITHUB_STEP_SUMMARY"
