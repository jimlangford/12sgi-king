name: CI - Test

# Run tests on pull_request and push to main (except when billing is locked).
# This workflow validates the test suite for CI/CD integration.
#
# Tests run on: PR, push to main, or manual dispatch
# Skips when: GitHub Actions is disabled due to billing (the if: condition returns false)
#
# If tests fail: Continue-on-error allows deployment to proceed (tests are validation, not blockers)
# On GitHub billing recovery: Automatically resumes

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-v2:
    name: V2 Contract + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi pydantic httpx pyyaml uvicorn
          # Install service-specific requirements
          for svc in auth tenant documents storage ai health; do
            [ -f services/$svc/requirements.txt ] && pip install -r services/$svc/requirements.txt || true
          done

      - name: Run V2 contract tests
        run: |
          pytest tests/v2/test_v2_contract.py -v --tb=short
        continue-on-error: true
        env:
          GOVOS_ALLOW_DEV_SECRETS: "1"

      - name: Run V2 integration stack tests
        run: |
          pytest tests/v2/test_v2_integration_stack.py -v --tb=short
        continue-on-error: true
        env:
          GOVOS_ALLOW_DEV_SECRETS: "1"

      - name: Run V2 hardening tests
        run: |
          pytest tests/v2/test_v2_hardening.py -v --tb=short
        continue-on-error: true
        env:
          GOVOS_ALLOW_DEV_SECRETS: "1"

      - name: Coverage report
        run: |
          pip install coverage
          coverage run -m pytest tests/v2/ --tb=short
          coverage report --fail-under=50 || true
        continue-on-error: true

  studio-assets-tests:
    name: Studio Assets Crosswalk Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          [ -f services/studio_assets/requirements.txt ] && \
            python -m pip install -r services/studio_assets/requirements.txt || true

      - name: Run Studio asset crosswalk tests
        run: |
          python -m unittest tests.test_studio_assets_crosswalk -v
        continue-on-error: true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-v2, studio-assets-tests]
    if: always()
    steps:
      - name: Report test status
        run: |
          echo "::group::Test Execution Summary"
          echo "V2 Contract Tests: ${{ needs.test-v2.result }}"
          echo "Studio Assets Tests: ${{ needs.studio-assets-tests.result }}"
          echo "::endgroup::"
          # Note: Both workflows are continue-on-error, so this job always succeeds
          # Tests are validation only; failures don't block deployment
