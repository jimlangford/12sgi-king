name: CI - Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-v2:
    name: V2 + Studio tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Run V2 suite and Studio tests
        run: python tools/local_validation.py --stage test --output-dir "${RUNNER_TEMP}/local-test-validation"
      - name: Test summary
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Python ${{ matrix.python }} tests"
            echo "Result: ${TEST_STATUS}"
            echo "Contract, loopback integration, hardening, and Studio asset validation."
            echo "No Docker, Neo4j, Ollama, or external credentials required."
          } >> "$GITHUB_STEP_SUMMARY"
