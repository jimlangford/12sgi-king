name: local-first publish

# Local-first architecture: GitHub is a support layer only.
# The active site is served from the local machine, behind localhost or Tailscale.
# GitHub Pages is intentionally not the production deployment path for this repo.
on:
  workflow_dispatch:
    inputs:
      build_site:
        description: Build the site on the runner for validation
        required: false
        default: true
        type: boolean
      dry_run:
        description: Validation-only run; do not treat this as a public deploy
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate-local-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build site for validation
        if: ${{ inputs.build_site == true }}
        run: |
          python build_site.py

      - name: Validate local hosting URLs
        run: |
          echo "Local-first hosting model"
          echo "Local: http://127.0.0.1:8080/site/"
          echo "Private Tailscale: http://<tailscale-ip>:8080/site/"
          echo "Private Tailscale hostname: https://<node>.ts.net/"
          echo "Public domain: https://12sgi.com/ (optional only after DNS points to the host public IP)"

      - name: Local publish guidance
        run: |
          echo "This repository is configured for local-first hosting."
          echo "GitHub is a support layer only. The live system remains on the local machine."
          echo "Do not treat GitHub Pages as the production deploy target for this project."
          echo "Deployments should be run locally via the local CI / service monitor stack."

      - name: Optional dry-run completion
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Validation complete. This was a dry run only."
